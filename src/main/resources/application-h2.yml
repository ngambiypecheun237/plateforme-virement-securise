# Profil de developpement local sans PostgreSQL : java -jar app.jar --spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:mem:virement;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  dev-mode: true

logging:
  level:
    com.banque.virement: DEBUG
